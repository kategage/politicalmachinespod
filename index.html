<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Political Machines | Coming Soon</title>
  <meta name="description" content="Political Machines: a podcast about technology and political campaigns. Coming soon.">
  <meta property="og:title" content="Political Machines">
  <meta property="og:description" content="A podcast about technology and political campaigns. Coming soon.">
  <meta property="og:url" content="https://politicalmachinespod.com/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0f1420">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f1420;
      --paper: #f1ead8;
      --red: #e0412f;
      --blue: #3d6bd6;
      --muted: #8a93a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    /* punch-card / ballot dot grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(241, 234, 216, 0.07) 1.2px, transparent 1.4px);
      background-size: 22px 22px;
      pointer-events: none;
    }
    .stripe {
      height: 10px;
      background: linear-gradient(90deg, var(--red) 0 50%, var(--blue) 50% 100%);
      position: relative;
      z-index: 1;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8vh 7vw;
      position: relative;
      z-index: 1;
    }
    .kicker {
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.6rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 0 rgba(224, 65, 47, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(224, 65, 47, 0.55); }
      70% { box-shadow: 0 0 0 12px rgba(224, 65, 47, 0); }
      100% { box-shadow: 0 0 0 0 rgba(224, 65, 47, 0); }
    }
    h1 {
      font-family: "Anton", "Impact", sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      line-height: 0.88;
      font-size: clamp(4rem, 15vw, 13rem);
      letter-spacing: 0.01em;
    }
    h1 .machines {
      display: block;
      color: transparent;
      -webkit-text-stroke: 2px var(--paper);
    }
    .tagline {
      margin-top: 2.2rem;
      font-size: clamp(1rem, 1.8vw, 1.3rem);
      max-width: 34ch;
      line-height: 1.5;
    }
    .status {
      margin-top: 2.6rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      border: 1.5px solid var(--paper);
      padding: 0.7rem 1.1rem;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      width: fit-content;
    }
    .cursor {
      display: inline-block;
      width: 0.6em; height: 1.1em;
      background: var(--paper);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    footer {
      padding: 1.4rem 7vw 1.8rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      position: relative;
      z-index: 1;
    }
    @media (prefers-reduced-motion: reduce) {
      .dot, .cursor { animation: none; }
    }
    @media (max-width: 520px) {
      h1 { font-size: 20vw; }
      h1 .machines { -webkit-text-stroke-width: 1.5px; }
    }
  </style>
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>
  <main>
    <p class="kicker"><span class="dot" aria-hidden="true"></span>A podcast</p>
    <h1>Political <span class="machines">Machines</span></h1>
    <p class="tagline">Technology, campaigns, and the machinery of modern politics.</p>
    <p class="status">Coming soon <span class="cursor" aria-hidden="true"></span></p>
  </main>
  <footer>&copy; <span id="yr">2026</span> Political Machines</footer>
  <script>document.getElementById("yr").textContent = new Date().getFullYear();</script>
</body>
</html>
